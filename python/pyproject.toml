[project]
name = "opsflow-engine"
version = "0.1.0"
description = "AI-native operational investigation engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.12.0",
    "langfuse>=4.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Declared explicitly rather than inherited. Ruff's default rule set has changed
# between releases, so an unpinned version plus an implicit select means the CI
# gate moves on its own. The version is pinned in the dev extra for the same reason.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in a parameter default is the documented FastAPI idiom, not a
# mutable-default bug. Same for Query/Path/Body/Header if they get used later.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
