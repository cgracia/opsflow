services:
  # ── Application ──────────────────────────────────────────────
  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: opsflow-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://opsflow:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/opsflow
      - QDRANT_URL=http://qdrant:6333
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opsflow-network

  # ── Data Stores ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: opsflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsflow}
      POSTGRES_DB: opsflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - opsflow-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: opsflow-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsflow-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: opsflow-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsflow-network

  redis:
    image: redis:7-alpine
    container_name: opsflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - opsflow-network

  # ── AI Observability (Langfuse) ─────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: opsflow-langfuse-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://opsflow:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/opsflow
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-mysalt}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-mysecret}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_CONNECTION_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opsflow-network

  langfuse-worker:
    image: langfuse/langfuse:3
    container_name: opsflow-langfuse-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      - DATABASE_URL=postgresql://opsflow:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/opsflow
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-mysalt}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-mysecret}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - REDIS_CONNECTION_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'langfuse' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opsflow-network

  # ── Monitoring ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: opsflow-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - opsflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: opsflow-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opsflow-network

# ── Networking ─────────────────────────────────────────────────
networks:
  opsflow-network:
    driver: bridge

# ── Persistent Volumes ─────────────────────────────────────────
volumes:
  postgres_data:
  qdrant_data:
  clickhouse_data:
  redis_data:
  grafana_data:
