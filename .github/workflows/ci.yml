name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  integration:
    # Integration tests run against real Postgres and Qdrant service
    # containers — the mocked unit suite cannot catch a broken live path
    # (v1 shipped with a green suite beside a Qdrant call that failed every
    # time and was swallowed).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
          POSTGRES_DB: opsflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
          - 6333:6333
    env:
      OPSFLOW_TEST_DATABASE_URL: postgresql+asyncpg://opsflow:opsflow@localhost:5432/opsflow_test
      OPSFLOW_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest tests/integration -v
